name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug — mostra estrutura do repo
        run: find . -maxdepth 3 -name "*.gradle.kts" -o -name "*.gradle" | head -20

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Baixa Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          echo "GRADLE_BIN=/tmp/gradle-8.5/bin/gradle" >> $GITHUB_ENV

      - name: Cria local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
        working-directory: unitvclone/unitvclone

      - name: Build APK
        run: $GRADLE_BIN assembleDebug --no-daemon --stacktrace
        working-directory: unitvclone/unitvclone

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniTV-debug
          path: unitvclone/unitvclone/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
